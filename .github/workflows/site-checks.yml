name: Landing page checks

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/site-checks.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate static site
        run: python3 site/validate-site.py
