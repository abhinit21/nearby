name: macOS checks

on:
  push:
    branches: [main]
    paths-ignore:
      - 'site/**'
  pull_request:
    paths-ignore:
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-package:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Check shell scripts and pinned runtime
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
          ./scripts/prepare-runtime.sh
      - name: Run automated tests
        run: xcrun swift test
      - name: Build and verify local app bundle
        run: |
          ./scripts/build-app.sh
          ./scripts/verify-app.sh
          unzip -t dist/Nearby-macOS.zip
